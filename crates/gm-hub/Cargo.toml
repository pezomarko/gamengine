[package]
name = "gm-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "AGPL-3.0-or-later"
description = "gamengine hub: accounts, characters, zone registry, session tokens, handoff, persistence."

[dependencies]
anyhow = { workspace = true }
argon2 = { workspace = true }
bitcode = { workspace = true }
gm-ai = { workspace = true }
gm-content = { workspace = true }
gm-core = { workspace = true, features = ["bitcode", "serde"] }
gm-hub-proto = { path = "../gm-hub-proto" }
gm-model = { workspace = true }
gm-net = { workspace = true, features = ["web"] }
gm-replay = { workspace = true }
quinn = { workspace = true }
rand = "0.9"
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["json", "time"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]

[dev-dependencies]
# The tests ingest in process (`IngestMode::InProcess(gm_ingest::in_process)`) and write uploads.
gm-ingest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }
