# A shield (ITEMS.md 2): worn in the left hand by anyone, guarding like an armour; a
# shield wall's own shield is the same model, held bare (abilities.toml).
[[template]]
id = "shield"
kind = "shield"
guards = "physical"
layers = ["shard", "core", "frame", "gem"]
model = "shield"
