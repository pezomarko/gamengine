# The body's places (EQUIPMENT.md 10.8, 2026-10-14: the chest, the head and the legs, the
# six places of the director's simplification): `place` names where an armour goes (the
# chest when nothing is said), each an overlay of its own on the striker from the Fantasy
# outfits' ranger set (LICENSES.md), each counting for its share of the body (5.5).
[[template]]
id = "cuirass"
kind = "armour"
guards = "physical"
layers = ["shard", "core", "frame", "gem"]
model = "cuirass"                            # the leather jerkin and its belts (LICENSES.md), on the striker
covers = ["spine", "chest"]

[[template]]
id = "hood"
kind = "armour"
place = "head"
guards = "elements"
layers = ["shard", "core", "catalyst", "frame", "gem"]
model = "hood"                               # the ranger's hood: cloth, over the hair
covers = []

[[template]]
id = "trousers"
kind = "armour"
place = "legs"
guards = "physical"
layers = ["shard", "core", "frame", "gem"]
model = "trousers"                           # the ranger's trousers and boots in one, over the body's own
covers = ["thigh_l", "thigh_r", "shin_l", "shin_r", "foot_l", "foot_r", "toe_l", "toe_r"]

# The knight's plate (EQUIPMENT.md 10.7, 2026-10-14): rigid pieces of the LowPoly
# Animated Knight pack bound whole to one bone by scripts/dev/blender-rigid-overlay.py
# (a helmet rides the head). The helm and the barbute leave the face open, so they cover
# nothing, like the hood; the great helm is a bucket with a cross slit and hides the
# head. (The shoulder plates went with the shoulders' place, 10.8.)
[[template]]
id = "helm"
kind = "armour"
place = "head"
guards = "physical"
layers = ["shard", "core", "frame", "gem"]
model = "helm"                               # the knight's open helm with a nasal and cheek guards
covers = []

[[template]]
id = "barbute"
kind = "armour"
place = "head"
guards = "physical"
layers = ["shard", "core", "frame", "gem"]
model = "barbute"                            # the knight's helm with cheek guards, the face open
covers = []

[[template]]
