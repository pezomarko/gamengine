layers = ["shard", "core", "catalyst", "frame", "gem"]
model = "focus"
held = "left"
fit = { turn = [90, 0, 0], scale = 0.7 }   # upright, the cover out, as a shield's face

# The accessory (EQUIPMENT.md 10.8): one place, numbers only, nothing drawn, built round a
# catalyst (the element) with gems. A ring raises what its wearer deals of the elements;
# a cape (`guards = "elements"`) lowers what it takes of them. One or the other; it counts
# for half. (Until 2026-10-14 the cape was an overlay on the back, ours; the model is
# gone with the place, and may come back when the accessory is drawn.)
[[template]]
id = "ring"
kind = "trinket"
place = "accessory"
layers = ["catalyst", "gem"]

[[template]]
id = "cape"
kind = "trinket"
place = "accessory"
guards = "elements"
layers = ["catalyst", "gem"]

# Stacks (MODES.md 11.1): one row and one slot, merged up to the cap, which is the strict
# limit of what a body carries. A firearm names the stack its reserve is drawn from
# (`ammo` in abilities.toml); a kit heals. Bought at the quartermaster's stall in town.
[[template]]
id = "ball"               # the musket's: the root's AWP carries 30
kind = "stack"
layers = []
cap = 30

[[template]]
id = "pistol_round"
kind = "stack"
layers = []
cap = 64

[[template]]
id = "carbine_round"      # the root's rifles carry 90
kind = "stack"
layers = []
cap = 90

[[template]]
id = "kit"                # used with F, in every mode
kind = "stack"
layers = []
cap = 5
heals = 300              # a third of a body of 1,000 (MATRIX.md: 500 + 40 × con)

