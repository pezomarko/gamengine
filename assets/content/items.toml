# Item content v1 (ECONOMY.md 4). Templates say which layers a craft may fill; materials say
# which layer they are and how large an edge they give, in per mille of the item's base
# stats. The loader refuses any template whose best possible craft exceeds 250 (PLAN.md 0:
# the gear edge is capped at 25%).
#
# What a worn item does (ITEMS.md 3.2): a weapon raises the damage its wearer deals, an
# armour lowers what its wearer takes, each layer for its own kinds of damage. A weapon's
# core sharpens the kind the weapon `strikes` with; an armour's core dulls what the armour
# `guards` against (`physical`: slash, pierce and blunt; `elements`: the five); a catalyst
# counts for its element; shard, frame and gems count for the kinds the core and the
# catalyst reach and for no other. An item is for one build and not for another.

# Where it is worn (ITEMS.md 2): a weapon in the right hand (`held = "either"`: or in the
# left beside another, two swords; `held = "two"`: both hands, EQUIPMENT.md 3), a shield
# (`kind = "shield"`) in the left, an armour on the body. An armour's `model` is its overlay (models/armour/<model>_<frame>.glb, CONTENT.md
# 3.3), drawn over the body with the body's pose; `covers` names the standard bones whose
# part of the body is hidden under it.
#
# Looks (CONTENT.md 3): `model` is the prop drawn in the hand of whoever wears one
# (models/props/<model>.glb), fitted into hand space by `fit` (metres, degrees about glTF's
# X, Y, Z in that order, a scale: the grip ends at the origin, the business end along +Z).
# The fist holds +Z across the forearm (a blade, a hammer); a turn about Y lays it
# elsewhere: 100 along the arm (what is aimed: the crossbow, the musket), a little the
# other way to stand it up (the staff). `gm-tools content look KEY --out x.png` shows it;
# `fit_view` is where the first-person view model sits (LOOK.md 6.4): a second fit, in the
# same terms, applied to the built prop in the view only, so what the fit laid along the
# arm is turned back to point along the look (the crossbow, the musket, the pistol). An
# icon is baked from the model unless icons/<icon>.png is given.

[[template]]
id = "sword"
kind = "weapon"
strikes = "slash"
layers = ["shard", "core", "catalyst", "frame", "gem"]
model = "sword"
held = "either"                              # one in each hand: the crusader's way (ITEMS.md 2)
fit = { turn = [90, 0, 0], scale = 0.36 }   # Quaternius' warrior sword (LICENSES.md): 3.2 m along +Y as it comes

# The colossus's greatsword (MATRIX.md 16), ours (`gm-tools content synth greatsword`): in
# metres already, held like the hammer.
[[template]]
id = "greatsword"
kind = "weapon"
strikes = "slash"
layers = ["shard", "core", "catalyst", "frame", "gem"]
model = "greatsword"

[[template]]
id = "dagger"
kind = "weapon"
strikes = "slash"
layers = ["shard", "core", "catalyst", "frame", "gem"]
model = "dagger"
held = "either"
fit = { turn = [90, 0, 0], scale = 0.55 }

[[template]]
id = "hammer"
kind = "weapon"
strikes = "blunt"
layers = ["shard", "core", "catalyst", "frame", "gem"]
model = "hammer"

# A staff takes both hands (EQUIPMENT.md 3): worn, it empties the left hand, and a shield
# or a second weapon worn afterwards takes it off; its edge counts for both hands.
[[template]]
id = "staff"
kind = "weapon"
strikes = "blunt"
layers = ["shard", "core", "catalyst", "frame", "gem"]
model = "staff"
held = "two"
fit = { move = [0.0, 0.0, 0.3], turn = [90, -20, 0], scale = 0.6 }

# The weapons of EQUIPMENT.md 5.6 (2026-10-14). The axe and the wand are KayKit's, along
# +Y as they come (LICENSES.md); the spear and the bow are the LowPoly Medieval Weapons
# pack's, cut into hand space by scripts/dev/blender-obj-prop.py (the grip at the origin,
# the length along +Z). The spear lies along the arm like the crossbow, down at rest and
# levelled into a thrust when the arm comes up, and is turned back to the look in the
# view; the bow takes the plain hold, so it stands upright when the arm is raised to aim.
[[template]]
id = "axe"
kind = "weapon"
strikes = "slash"
layers = ["shard", "core", "catalyst", "frame", "gem"]
model = "axe"
held = "either"
fit = { turn = [90, 0, 0], scale = 0.6 }

[[template]]
id = "spear"
kind = "weapon"
strikes = "pierce"
layers = ["shard", "core", "catalyst", "frame", "gem"]
model = "spear"
held = "two"
fit = { turn = [0, 90, 0] }
fit_view = { turn = [0, -90, 0] }

[[template]]
id = "bow"
kind = "weapon"
strikes = "pierce"
layers = ["shard", "core", "catalyst", "frame", "gem"]
model = "bow"
held = "two"

[[template]]
id = "wand"
kind = "weapon"
strikes = "blunt"                            # the bolt is a blow of force (abilities.toml: wand)
layers = ["shard", "core", "catalyst", "frame", "gem"]
model = "wand"
fit = { turn = [90, 0, 0], scale = 0.5 }

