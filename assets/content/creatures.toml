# Creatures (COMPANIONS.md 8.1). A creature is a build without a budget: the same frames,
# aspects and verbs as a player, read by the same rules, with its health set
# here. Abilities marked `creature = true` in abilities.toml are theirs alone. A creature may
# hold a ranged primary in its secondary slot (the range rule of MATRIX.md 10 is for players).
# `still = true` stands and does nothing (the dummy); `npc = true` cannot be hurt and is spoken
# to with `E` (the smith). `might` multiplies a creature's damage (1 = a player's numbers).
# v2 (2026-10-06): players have about seven times v1's health; creatures three times, and
# their blows two and a half.

[[creature]]
key = "sentinel"
name = "Sentinel"
frame = "striker"
aspects = ["water"]
attributes = { str = 16, agi = 14, con = 16, int = 8, spr = 10 }
health = 120
might = 1.0
primary = "sword"
secondary = "crossbow"
guard = "parry"
actives = ["overhead", "dash"]
sight = 700
leash = 900
respawn_s = 600

[[creature]]
key = "warden"
name = "The Warden"
frame = "colossus"
aspects = ["ground"]
attributes = { str = 20, agi = 8, con = 20, int = 14, spr = 14 }
health = 1500
might = 2.0
stagger_threshold = 400
primary = "maul"
secondary = "stone_throw"
actives = ["quake", "stomp"]
sight = 900
leash = 1100
boss = true
respawn_s = 120
[creature.loot]
components = 3
standard = ["core/iron", "frame/ash", "catalyst/basalt"]
top = ["core/dragonbone", "frame/whalebone", "catalyst/basalt"]
coin = 30

# The town (2026-10-06): a dummy to count one's damage on.

[[creature]]
key = "dummy"
name = "Training dummy"
frame = "colossus"
aspects = ["ground"]
attributes = { str = 5, agi = 5, con = 5, int = 5, spr = 5 }
health = 500
stagger_threshold = 60000
primary = "staff"
secondary = "kick"
sight = 0
leash = 0
respawn_s = 5
still = true

# The blacksmith (ITEMS.md 6.6, 2026-10-19): stands at the forge by the mouth of the
# dummies' street, sells every material, and the forge beside him makes a craft of them
# for a fee. A hammer in his hand: an npc holds its primary's prop (LOOK.md 6.1).

[[creature]]
key = "smith"
name = "Blacksmith"
frame = "striker"
aspects = ["fire"]
attributes = { str = 5, agi = 5, con = 5, int = 5, spr = 5 }
health = 100
primary = "hammer"
secondary = "kick"
sight = 0
leash = 0
still = true
npc = true
role = "smith"
wears = { chest = "cuirass", legs = "trousers" }

# The ladder's first step (SKILLS.md 5): the yard. A sparring master at the south end of the
# dummies' street swings slowly, telegraphed and parryable, for a point; beating it is the
# `yard` trial, and it opens the second move.

[[creature]]
key = "yard_master"
