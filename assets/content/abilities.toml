# gamengine v1 abilities (MATRIX.md 10). Authored in milliseconds and names; gm-content compiles
# this against the zone tick rate and validates it against VOCABULARY.md 11 and MATRIX.md.
# Nothing is priced (MATRIX.md 20, 2026-10-20: no kit points): a primary is a melee weapon or
# the ranged one (the range is the weapon's, 2026-10-06), a secondary a short utility or the
# weapon's second move, a guard the off hand's, an active a body's skill or a weapon's spell.
# Damage types: slash pierce blunt (physical) | fire water grass electric ground air (elements).
# An ability with an `aspect` needs that aspect in the build; its elemental packets are that element.

# ---------- primaries ----------

[[ability]]
key = "sword"
name = "Sword"
slot = "primary"
prop = "sword"
cooldown_ms = 600
move_scale = 0.6
interrupt = "on_stagger"
# The first of three (MODES.md 4.3): pressed again in the recovery or within 400 ms after
# it, the slot plays `sword_2`; the magnet turns the body 30 degrees toward the nearest.
chain = { next = "sword_2", window_ms = 400 }
[[ability.step]]
at_ms = 0
melee_arc = { reach = 72, arc = 90, half_height = 40, windup_ms = 150, active_ms = 60, recovery_ms = 300, damage = { amount = 6, type = "slash", knockback = 150, stagger = 20 }, max_targets = 3, cleave_falloff = 0.7, parryable = true, hit_stop_ms = 30, assist = 30 }

