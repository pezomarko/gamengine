# The fast lane: what every pull request and every push to main must pass, in parallel jobs
# that finish in minutes. The compiler is the one rust-toolchain.toml names, so a lint added
# by a newer release never turns main red by itself. The long gates (bots over the wire,
# screens on a display, the browser) are gates.yml: nightly and on demand, one job each, so
# a hang in one never hides the others.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: fmt, clippy (native, wasm), unused dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - name: "System packages (ALSA's headers: the client links the sound device, SOUND.md 4)"
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy, native (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, the browser target, both builds
        run: |
          cargo clippy -p gm-client --target wasm32-unknown-unknown --locked -- -D warnings
          cargo clippy -p gm-client --target wasm32-unknown-unknown --features webgl --locked -- -D warnings
      - uses: taiki-e/install-action@cargo-machete
      - name: Unused dependencies (a crate nobody links is a crate nobody audits)
        run: cargo machete

  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gm
          POSTGRES_PASSWORD: gm
          POSTGRES_DB: gm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The hub's tests wipe this database (HUB.md 5).
      GM_TEST_DATABASE_URL: postgres://gm:gm@localhost:5432/gm_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - name: System packages (ALSA's headers)
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev
      - name: Tests
        run: cargo test --workspace --locked

  assets:
    name: assets (maps reproduced, budgets, the content bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: assets
      - name: System packages (ALSA's headers, unzip for the map compiler)
        run: sudo apt-get update -q && sudo apt-get install -y -q unzip libasound2-dev
      - name: Fetch ericw-tools (pinned)
        run: scripts/fetch-ericw-tools.sh
      - name: Rebuild the maps with the pinned compiler
        run: |
          for m in test_room arena town dungeon; do
            cargo run -q -p gm-tools --locked -- map build "assets/maps/src/$m.map" --out target/ci-maps
          done
      - name: Asset budgets
        run: scripts/check-budgets.sh
      - name: Asset budgets self-test (an over-budget asset must fail)
        run: scripts/check-budgets.sh --self-test
      - name: The content tables, and the committed bundle reproduced byte for byte (CONTENT.md 5)
        run: cargo run -q -p gm-tools --locked -- content check --built assets/built/content

  size:
    name: sizes (the native client, both browser builds)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: size
      - name: System packages (ALSA's headers, brotli for the packed sizes)
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev brotli
      - name: Build release client
        run: cargo build --release -p gm-client --locked
      - name: Binary size gate
        run: SKIP_BUILD=1 scripts/check-binary-size.sh
      - name: Binary size self-test (a 1 MiB regression must fail)
        run: SKIP_BUILD=1 scripts/check-binary-size.sh --self-test
      - name: Fetch the browser build's tools (pinned)
        run: scripts/fetch-web-tools.sh
      - name: Browser builds and their size gate
        run: SIZES_ONLY=1 scripts/check-web.sh
